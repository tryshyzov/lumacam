name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The version shown in Settings comes from the tag, like the installer's.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          (Get-Content camera_studio/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$version`"" |
            Set-Content camera_studio/__init__.py
          Select-String -Path camera_studio/__init__.py -Pattern '__version__'

      - name: Fetch ADB
        shell: pwsh
        run: ./scripts/fetch-platform-tools.ps1

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LumaLinkStudio.spec

      - uses: microsoft/setup-msbuild@v2

      # LumaLink Camera, the DirectShow virtual camera the installer registers.
      - name: Build virtual camera
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'Win32') {
            msbuild virtualcam\LumaLinkCamera.vcxproj /nologo /v:m /p:Configuration=Release /p:Platform=$platform
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $arguments = @('installer\LumaLinkStudio.iss')
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $arguments = @("/DAppVersion=$($env:GITHUB_REF_NAME.Substring(1))") + $arguments
          }
          & $iscc @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Code signing goes here once the project is accepted by SignPath
      # Foundation: submit the two artifacts below for signing and publish the
      # signed copies instead. Until then the binaries are unsigned.

      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkStudio-windows
          path: |
            dist/LumaLinkStudio.exe
            dist/installer/*.exe
          if-no-files-found: error

  macos:
    name: macOS desktop app (${{ matrix.arch }})
    # Python and its packages are built per processor, so each runner builds
    # the app for its own: Apple silicon and Intel.
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("camera_studio/__init__.py")
          version = os.environ["GITHUB_REF_NAME"][1:]
          path.write_text(re.sub(r'__version__ = ".*"', f'__version__ = "{version}"', path.read_text()))
          PY
          grep __version__ camera_studio/__init__.py

      # Builds the app for this runner's processor and its disk image, with
      # ADB (fetched by the script) inside; the adaptive icon is compiled when
      # the runner's Xcode can.
      - name: Build app and disk image
        env:
          PYTHON: python
        run: scripts/build-macos.sh

      # Signed ad hoc until there is a Developer ID: macOS asks to confirm the
      # first launch (right-click → Open).
      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkStudio-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux desktop app
    # The oldest supported runner, so the app runs on distributions as old as
    # its glibc (Ubuntu 22.04, Debian 12 and newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("camera_studio/__init__.py")
          version = os.environ["GITHUB_REF_NAME"][1:]
          path.write_text(re.sub(r'__version__ = ".*"', f'__version__ = "{version}"', path.read_text()))
          PY
          grep __version__ camera_studio/__init__.py

      # ADB is the VPN-proof fallback for the USB transport; see vendor/README.md.
      - name: Fetch ADB
        run: |
          curl -fsSL -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          mkdir -p vendor
          unzip -q -o platform-tools.zip -d vendor
          test -x vendor/platform-tools/adb

      - name: Build AppImage and .deb
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import camera_studio; print(camera_studio.__version__)')+${GITHUB_SHA::7}"
          fi
          sh packaging/linux/build.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkStudio-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Builds packaging/arch/PKGBUILD from this checkout on Arch Linux, installs
  # the package and starts the program, so the recipe keeps working there.
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: >-
          pacman -Syu --noconfirm --needed base-devel git python
          fontconfig libglvnd libxkbcommon-x11 xcb-util-cursor xcb-util-wm xcb-util-keysyms

      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          useradd -m builder
          version=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          work=/home/builder/pkg
          mkdir -p "$work"
          git config --global --add safe.directory "$PWD"
          # The code checked out here, under the name the PKGBUILD downloads.
          git archive --prefix="lumacam-$version/" -o "$work/lumacam-$version.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/lumalink-studio.install "$work/"
          sed -i "s|^sha256sums=.*|sha256sums=('SKIP')|" "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd $work && makepkg --noconfirm"

      - name: Install it and start the program
        run: |
          pacman -U --noconfirm /home/builder/pkg/lumalink-studio-*.pkg.tar.zst
          status=0
          QT_QPA_PLATFORM=offscreen timeout 8 lumalink-studio || status=$?
          # 124: still running when the time was up, as it should be.
          test "$status" -eq 124

  android:
    name: Android companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A stable key lets a new APK install over the previous one. Builds that
      # cannot read the secret (pull requests from forks) fall back to a debug APK.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumalink-release.jks"
            echo "keystore=$RUNNER_TEMP/lumalink-release.jks" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is required to publish a release."
            exit 1
          fi

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        env:
          LUMALINK_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          LUMALINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMALINK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The app users get, which updates itself to later releases.
            export LUMALINK_VERSION_NAME="${GITHUB_REF_NAME#v}"
            ./gradlew :app:assembleRelease --no-daemon
            cp android-app/build/outputs/apk/release/app-release.apk LumaLinkCompanion.apk
          else
            # Everything else is "LumaLink Test", a separate app next to it.
            export LUMALINK_TEST_BUILD=1
            if [ -n "$LUMALINK_KEYSTORE_FILE" ]; then
              ./gradlew :app:assembleRelease --no-daemon
              cp android-app/build/outputs/apk/release/app-release.apk LumaLinkTest.apk
            else
              ./gradlew :app:assembleDebug --no-daemon
              cp android-app/build/outputs/apk/debug/app-debug.apk LumaLinkTest-debug.apk
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkCompanion-android
          path: LumaLink*.apk
          if-no-files-found: error

  # Fails a tag right away when its release text is missing (release-notes/README.md).
  release-notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - name: Check the notes for this version
        run: |
          notes="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ ! -s "$notes" ]; then
            echo "::error file=$notes::Write $notes before tagging ${GITHUB_REF_NAME}"
            exit 1
          fi

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-notes, desktop, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' \))
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LumaLink ${GITHUB_REF_NAME#v}" \
            --notes-file "release-notes/${GITHUB_REF_NAME#v}.md"
