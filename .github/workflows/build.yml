name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch ADB
        shell: pwsh
        run: ./scripts/fetch-platform-tools.ps1

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LumaLinkStudio.spec

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $arguments = @('installer\LumaLinkStudio.iss')
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $arguments = @("/DAppVersion=$($env:GITHUB_REF_NAME.Substring(1))") + $arguments
          }
          & $iscc @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Code signing goes here once the project is accepted by SignPath
      # Foundation: submit the two artifacts below for signing and publish the
      # signed copies instead. Until then the binaries are unsigned.

      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkStudio-windows
          path: |
            dist/LumaLinkStudio.exe
            dist/installer/*.exe
          if-no-files-found: error

  android:
    name: Android companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A stable key lets a new APK install over the previous one. Builds that
      # cannot read the secret (pull requests from forks) fall back to a debug APK.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumalink-release.jks"
            echo "keystore=$RUNNER_TEMP/lumalink-release.jks" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is required to publish a release."
            exit 1
          fi

      - name: Build APK
        env:
          LUMALINK_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          LUMALINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMALINK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export LUMALINK_VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$LUMALINK_KEYSTORE_FILE" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp android-app/build/outputs/apk/release/app-release.apk LumaLinkCompanion.apk
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp android-app/build/outputs/apk/debug/app-debug.apk LumaLinkCompanion-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LumaLinkCompanion-android
          path: LumaLinkCompanion*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.apk' \))
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LumaLink ${GITHUB_REF_NAME#v}" \
            --generate-notes
